<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="strictmode">
  <!--
    <s> — angle brackets framing the header's flame square, with the s knocked
    out of it. Proportioned so it degrades: the square carries 44% of the width
    and the brackets are hairlines pushed to the edges, so as the icon shrinks
    the brackets fade and the square — already the mark in the header — is what
    survives.
  -->
  <rect width="32" height="32" rx="7" fill="#12100f"/>
  <g fill="none" stroke="#e4572e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" opacity="0.7">
    <path d="M6.6 10.4 3.2 16l3.4 5.6"/>
    <path d="M25.4 10.4 28.8 16l-3.4 5.6"/>
  </g>
  <rect x="9" y="9" width="14" height="14" rx="3" fill="#e4572e"/>
  <path
    d="M19.1 13.2c0-1.25-1.25-1.9-2.85-1.9s-2.85.65-2.85 1.9c0 1.3 1.42 1.68 2.85 1.92 1.43.24 2.85.62 2.85 1.92 0 1.25-1.25 1.9-2.85 1.9s-2.85-.65-2.85-1.9"
    fill="none" stroke="#12100f" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
